<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shree Prannath Oil — Find Us Online</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ivory:#FBF3E3;
    --gold:#C68A1E;
    --amber:#E8A83C;
    --maroon:#6B1F1F;
    --ink:#2A1B0F;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    background:var(--ivory);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100%;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 24px 40px;
    background:
      radial-gradient(circle at 50% -10%, rgba(230,168,60,0.25), transparent 55%),
      var(--ivory);
  }

  .mark{
    width:64px;
    height:64px;
    margin-bottom:22px;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--maroon);
    font-weight:600;
    margin-bottom:10px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:42px;
    line-height:1.05;
    text-align:center;
    color:var(--ink);
  }

  .tagline{
    margin-top:10px;
    font-size:14.5px;
    color:#6b5a44;
    text-align:center;
    max-width:280px;
    line-height:1.5;
  }

  .drip-divider{
    width:120px;
    height:14px;
    margin:28px 0 34px;
  }

  .links{
    width:100%;
    max-width:360px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    background:#fff;
    border:1px solid rgba(198,138,30,0.35);
    border-radius:14px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 2px 10px rgba(107,31,31,0.06);
    transition:transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .link-card:active{
    transform:scale(0.98);
  }

  @media (hover:hover){
    .link-card:hover{
      border-color:var(--gold);
      box-shadow:0 6px 18px rgba(198,138,30,0.18);
      transform:translateY(-1px);
    }
  }

  .icon{
    flex:none;
    width:38px;
    height:38px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .icon svg{ width:20px; height:20px; }

  .icon.fb{ background:#e7edf6; }
  .icon.ig{ background:#fbeade; }
  .icon.tt{ background:#eef0f2; }

  .link-text{ flex:1; }

  .link-label{
    font-size:15px;
    font-weight:600;
  }

  .link-sub{
    font-size:12px;
    color:#8a7a63;
    margin-top:1px;
  }

  .chevron{
    flex:none;
    color:var(--gold);
    font-size:16px;
  }

  footer{
    margin-top:44px;
    font-size:11.5px;
    letter-spacing:0.05em;
    color:#a7987f;
    text-align:center;
  }
</style>
</head>
